############################
## THEME
## The site uses the last release of the (now archived) Hugo Blox Bootstrap theme,
## kept as a local copy in themes/ (blox-bootstrap imports blox-core and blox-seo).
## See themes/README.md for its origin and the local patches.
############################

imports:
  - path: blox-bootstrap

# The templates use APIs introduced in Hugo 0.158 (hugo.Data, hugo.Sites, locale).
hugoVersion:
  min: '0.158.0'
  extended: true
